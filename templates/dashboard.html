<main
  class="max-w-5xl mx-auto mt-10 p-8 bg-gradient-to-br from-cyan-50 via-teal-100 to-blue-100 rounded-2xl shadow-lg animate-[fadeInUp_0.7s_cubic-bezier(.36,.07,.19,.97)]"
>
  <h1 class="text-3xl font-bold mb-6 select-none">Hello Suko 👋</h1>
  <section>
    <h2 class="text-xl font-semibold mb-4">Report Issue</h2>

    <!-- Desktop Table -->
    <div class="overflow-x-auto rounded-xl bg-white shadow hidden md:block">
      <div class="max-h-72 overflow-y-auto">
        <table
          id="issuesTable"
          class="min-w-full text-left text-sm border-collapse"
        >
          <thead class="bg-gray-300 sticky top-0">
            <tr>
              <th class="px-4 py-2">Ref No.</th>
              <th class="px-4 py-2">Category</th>
              <th class="px-4 py-2">Type</th>
              <th class="px-4 py-2">Status</th>
              <th class="px-4 py-2">Notes</th>
              <th class="px-4 py-2">Date</th>
              <th class="px-4 py-2">Time</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- Mobile/Tablet Cards -->
    <div id="issuesCards" class="block md:hidden space-y-4"></div>

    <div class="flex justify-end">
      <a href="report">
        <button
          class="mt-6 px-5 py-2 bg-indigo-600 text-white rounded-lg shadow hover:bg-indigo-700 transition"
        >
          Report Issue
        </button>
      </a>
    </div>
  </section>
</main>

<script src="static/js/dashboard.js"></script>
{% endblock %}
