<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Forgot Password — Email</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="min-h-screen font-sans bg-[#e0e7ff] bg-[linear-gradient(120deg,hsl(228,96%,89%)_0%,#e0e7ff_100%)] transition-colors duration-500 flex flex-col items-center justify-center p-6"
  >
    <div
      class="w-full max-w-md bg-white/95 backdrop-blur-sm rounded-xl shadow-xl p-8"
    >
      <header class="mb-6 text-center">
        <h1 class="text-2xl font-extrabold text-indigo-700">
          Reset your password
        </h1>
        <p class="text-sm text-gray-600 mt-1">
          Enter your DUT email and we'll send a reset link.
        </p>
      </header>

      <form id="emailForm" class="space-y-4" novalidate>
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700"
            >Email</label
          >
          <input
            id="email"
            name="email"
            type="email"
            required
            class="mt-1 block w-full px-4 py-2 rounded-lg bg-gray-100 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
            placeholder="you@dut4life.ac.za"
          />
          <p id="hint" class="mt-1 text-xs text-gray-500">
            Use your DUT email (example: name@dut4life.ac.za)
          </p>
          <p
            id="emailError"
            class="mt-1 text-xs text-red-600 hidden"
            aria-live="polite"
          ></p>
        </div>

        <div>
          <button
            type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition"
          >
            Send Reset Link
          </button>
        </div>

        <div class="text-center text-sm text-gray-500">
          <a href="{{ url_for('sign_in') }}" class="underline"
            >Back to sign in</a
          >
        </div>
      </form>
    </div>

    <script src="{{ url_for('static', filename='js/forgot-password-email.js') }}"></script>
  </body>
</html>
