{% extends 'forgot-password-base.html' %} {% block head %}
<title>Forgot Password — New Password</title>
{% endblock %} {% block body %}

<div
  class="w-full max-w-md bg-white/95 backdrop-blur-sm rounded-xl shadow-xl p-8"
>
  <header class="mb-4 text-center">
    <h1 class="text-2xl font-extrabold text-indigo-700">Create new password</h1>
    <p id="emailNotice" class="text-sm text-gray-600 mt-1">
      Enter a strong new password.
    </p>
  </header>

  <form id="newForm" class="space-y-4" novalidate>
    <div>
      <label for="newPassword" class="block text-sm font-medium text-gray-700"
        >New Password</label
      >
      <input
        id="newPassword"
        name="newPassword"
        type="password"
        required
        class="mt-1 block w-full px-4 py-2 rounded-lg bg-gray-100 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        placeholder="At least 6 characters"
      />
    </div>

    <div>
      <label
        for="confirmPassword"
        class="block text-sm font-medium text-gray-700"
        >Confirm Password</label
      >
      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        required
        class="mt-1 block w-full px-4 py-2 rounded-lg bg-gray-100 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        placeholder="Repeat your new password"
      />
      <p
        id="pwError"
        class="mt-1 text-xs text-red-600 hidden"
        aria-live="polite"
      ></p>
    </div>

    <div>
      <button
        id="resetBtn"
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition"
      >
        Reset Password
      </button>
    </div>

    <div
      id="success"
      class="hidden mt-4 p-4 rounded-lg bg-green-50 border border-green-100 text-green-800 text-sm text-center"
    >
      Password reset successful. Redirecting to sign in…
    </div>

    <div class="text-center text-sm text-gray-500 mt-3">
      <a id="cancelLink" href="sign-in.html" class="underline">Cancel</a>
    </div>
  </form>
  <p class="mt-6 text-sm text-center text-gray-600">
    Remembered your password?
    <a href="login.html" class="text-indigo-600 hover:underline"
      >Back to login</a
    >
  </p>
</div>

<script src="{{ url_for('static', filename='js/forgot-password-new.js') }}"></script>
{% endblock %}
