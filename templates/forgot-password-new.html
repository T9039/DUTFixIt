<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forgot Password — New Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen font-sans bg-[#e0e7ff] bg-[linear-gradient(120deg,hsl(228,96%,89%)_0%,#e0e7ff_100%)] transition-colors duration-500 flex flex-col items-center justify-center p-6">
  <div class="w-full max-w-md bg-white/95 backdrop-blur-sm rounded-xl shadow-xl p-8">
    <header class="mb-4 text-center">
      <h1 class="text-2xl font-extrabold text-indigo-700">Create new password</h1>
      <p id="emailNotice" class="text-sm text-gray-600 mt-1">Enter a strong new password.</p>
    </header>

    <form id="newForm" class="space-y-4" novalidate>
      <div>
        <label for="newPassword" class="block text-sm font-medium text-gray-700">New Password</label>
        <input id="newPassword" name="newPassword" type="password" required
               class="mt-1 block w-full px-4 py-2 rounded-lg bg-gray-100 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
               placeholder="At least 6 characters" />
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
        <input id="confirmPassword" name="confirmPassword" type="password" required
               class="mt-1 block w-full px-4 py-2 rounded-lg bg-gray-100 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
               placeholder="Repeat your new password" />
        <p id="pwError" class="mt-1 text-xs text-red-600 hidden" aria-live="polite"></p>
      </div>

      <div>
        <button id="resetBtn" type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition">
          Reset Password
        </button>
      </div>

      <div id="success" class="hidden mt-4 p-4 rounded-lg bg-green-50 border border-green-100 text-green-800 text-sm text-center">
        Password reset successful. Redirecting to sign in…
      </div>

      <div class="text-center text-sm text-gray-500 mt-3">
        <a id="cancelLink" href="sign-in.html" class="underline">Cancel</a>
      </div>
    </form>
    <p class="mt-6 text-sm text-center text-gray-600">
      Remembered your password?
      <a href="login.html" class="text-indigo-600 hover:underline">Back to login</a>
    </p>
  </div>

  <script>
    const newForm = document.getElementById('newForm');
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const pwError = document.getElementById('pwError');
    const success = document.getElementById('success');
    const emailNotice = document.getElementById('emailNotice');

    const resetEmail = sessionStorage.getItem('resetEmail');
    if (resetEmail) {
      emailNotice.textContent = `Resetting password for ${resetEmail}`;
    }

    newForm.addEventListener('submit', (e) => {
      e.preventDefault();
      pwError.classList.add('hidden');

      const a = (newPassword.value || '').trim();
      const b = (confirmPassword.value || '').trim();

      if (!a || !b) {
        pwError.textContent = 'Please fill both fields.';
        pwError.classList.remove('hidden');
        return;
      }
      if (a.length < 6) {
        pwError.textContent = 'Password must be at least 6 characters long.';
        pwError.classList.remove('hidden');
        newPassword.focus();
        return;
      }
      if (a !== b) {
        pwError.textContent = 'Passwords do not match.';
        pwError.classList.remove('hidden');
        confirmPassword.focus();
        return;
      }

      success.classList.remove('hidden');
      sessionStorage.removeItem('resetEmail');

      setTimeout(() => {
        window.location.href = 'sign-in.html';
      }, 1400);
    });
  </script>
</body>
</html>
