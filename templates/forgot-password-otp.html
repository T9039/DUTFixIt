<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Forgot Password — OTP</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen font-sans bg-[#e0e7ff] bg-[linear-gradient(120deg,hsl(228,96%,89%)_0%,#e0e7ff_100%)] transition-colors duration-500 flex flex-col items-center justify-center p-6">
  <div class="w-full max-w-md bg-white/95 backdrop-blur-sm rounded-xl shadow-xl p-8">
    <header class="mb-6 text-center">
      <h1 class="text-2xl font-extrabold text-indigo-700">Enter OTP Code</h1>
      <p id="emailNotice" class="text-sm text-gray-600 mt-1">
        We've sent a code to your email.
      </p>
    </header>

    <form id="otpForm" class="space-y-4" novalidate>
      <div>
        <label for="otp" class="block text-sm font-medium text-gray-700">OTP Code</label>
        <input id="otp" name="otp" type="text" inputmode="numeric" maxlength="6" required
               class="mt-1 block w-full px-4 py-2 rounded-lg bg-gray-100 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 tracking-widest text-center font-mono text-lg"
               placeholder="Enter 6-digit code" autocomplete="one-time-code" />
        <p id="otpError" class="mt-1 text-xs text-red-600 hidden" aria-live="polite"></p>
        <p id="demo" class="mt-1 text-xs text-gray-400 text-center">Demo code: <span class="font-bold">123456</span></p>
      </div>

      <div>
        <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition">
          Verify OTP
        </button>
      </div>

      <div class="text-center text-sm text-gray-500 mt-2">
        <button id="resendBtn" type="button" class="underline">Resend code</button>
        <span> | </span>
        <a href="sign-in.html" class="underline">Back to sign in</a>
      </div>
    </form>
  </div>

  <script>
    const otpForm = document.getElementById('otpForm');
    const otpInput = document.getElementById('otp');
    const otpError = document.getElementById('otpError');
    const emailNotice = document.getElementById('emailNotice');
    const resendBtn = document.getElementById('resendBtn');

    // Optionally prefill email notice using sessionStorage (set by email page)
    const resetEmail = sessionStorage.getItem('resetEmail');
    if (resetEmail) {
      emailNotice.textContent = `Enter the code sent to ${resetEmail}`;
    }

    otpForm.addEventListener('submit', (e) => {
      e.preventDefault();
      otpError.classList.add('hidden');
      const otp = (otpInput.value || '').trim();

      // Demo: Accept code "123456" only
      if (!otp || otp.length !== 6) {
        otpError.textContent = 'Please enter the 6-digit code.';
        otpError.classList.remove('hidden');
        otpInput.focus();
        return;
      }
      if (otp !== '123456') {
        otpError.textContent = 'Incorrect code. Please try again.';
        otpError.classList.remove('hidden');
        otpInput.focus();
        return;
      }
      // In a real flow, verify OTP via backend before continuing
      window.location.href = 'forgot-password-new.html';
    });

    resendBtn.addEventListener('click', () => {
      // In real flow, trigger resend via backend
      alert('A new code has been sent to your email.');
    });
  </script>
</body>
</html>
