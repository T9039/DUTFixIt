{% extends 'forgot-password-base.html' %} {% block head %}
<title>Forgot Password — OTP</title>
{% endblock %} {% block body %}

<div
  class="w-full max-w-md bg-white/95 backdrop-blur-sm rounded-xl shadow-xl p-8 animate-[fadeInUp_0.7s_cubic-bezier(.36,.07,.19,.97)]"
>
  <header class="mb-6 text-center">
    <h1 class="text-2xl font-extrabold text-indigo-700">Enter OTP Code</h1>
    <p id="emailNotice" class="text-sm text-gray-600 mt-1">
      We've sent a code to your email.
    </p>
  </header>

  <form id="otpForm" class="space-y-4" novalidate>
    <div>
      <label for="otp" class="block text-sm font-medium text-gray-700"
        >OTP Code</label
      >
      <input
        id="otp"
        name="otp"
        type="text"
        inputmode="numeric"
        maxlength="6"
        required
        class="mt-1 block w-full px-4 py-2 rounded-lg bg-gray-100 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500 tracking-widest text-center font-mono text-lg"
        placeholder="Enter 6-digit code"
        autocomplete="one-time-code"
      />
      <p
        id="otpError"
        class="mt-1 text-xs text-red-600 hidden"
        aria-live="polite"
      ></p>
      <p id="demo" class="mt-1 text-xs text-gray-400 text-center">
        Demo code: <span class="font-bold">123456</span>
      </p>
    </div>

    <div>
      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition"
      >
        Verify OTP
      </button>
    </div>

    <div class="text-center text-sm text-gray-500 mt-2">
      <button id="resendBtn" type="button" class="underline">
        Resend code
      </button>
      <span> | </span>
      <a href="{{ url_for('sign_in') }}" class="underline"> Back to sign in </a>
    </div>
  </form>
</div>

<script src="{{ url_for('static', filename='js/forgot-password-otp.js') }}"></script>
{% endblock %}
