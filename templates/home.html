{% extends 'base.html' %}
{% block head %}

<title>Fix IT DUT</title>

<script>
  tailwind.config = {
    theme: {
      extend: {
        keyframes: {
          fadein: {
            "0%": { opacity: "0", transform: "translateY(20px)" },
            "100%": { opacity: "1", transform: "translateY(0)" },
          },
        },
        animation: {
          fadein: "fadein 0.8s cubic-bezier(.36,.07,.19,.97) both",
        },
      },
    },
  };
</script>

{% endblock %}

{% block body %}
<body
  style="background-image: url('/static/img/bg-img-bc-desktop.jpeg'); background-size: cover; background-position: center;"
  class="m-0 font-sans min-h-screen flex justify-center items-center p-4 overflow-x-hidden relative"
>

  <!-- Desktop & Tablet -->
  <div class="hidden md:block animate-fadein bg-white rounded-2xl shadow-2xl max-w-3xl w-[90%] p-8 pb-20 flex items-center justify-center relative z-10" role="main">
    <div class="flex flex-col items-center justify-center gap-1 pb-4" role="region" aria-label="Branding and values">
      <h1 class="font-black text-4xl sm:text-[2.8rem] select-none cursor-pointer inline-block tracking-tight text-center transition-transform duration-200 hover:scale-110 hover:-rotate-2 hover:shadow-2xl hover:text-shadow focus:scale-110 focus:-rotate-2 focus:shadow-2xl outline-none"
        tabindex="0">
        <span class="text-neutral-900">Fix IT </span>
        <span class="text-neutral-900">D</span>
        <span class="text-[#2E3A8A]">U</span>
        <span class="text-neutral-900">T</span>
      </h1>
      <p class="font-semibold text-[#595B73] text-xl select-none mt-2 mb-6 text-center max-w-xl tracking-wide">
        Better Maintenance, Smoother Campus.
      </p>

      <div class="flex flex-wrap justify-center items-center gap-7 mt-8 max-w-xl" aria-label="Values images">
        <div class="flex-1 max-w-32 aspect-square rounded-xl shadow-md overflow-hidden bg-white transition-transform duration-200 hover:scale-110 hover:-rotate-2 hover:shadow-2xl">
          <img src='/static/img/accountability2.jpeg' alt="Accountability" class="w-full h-full object-cover select-none transition duration-200" />
        </div>
        <div class="flex-1 max-w-32 aspect-square rounded-xl shadow-md overflow-hidden bg-white transition-transform duration-200 hover:scale-110 hover:-rotate-2 hover:shadow-2xl">
          <img src="/static/img/transparency2.jpeg" alt="Transparency" class="w-full h-full object-cover select-none transition duration-200" />
        </div>
        <div class="flex-1 max-w-32 aspect-square rounded-xl shadow-md overflow-hidden bg-white transition-transform duration-200 hover:scale-110 hover:-rotate-2 hover:shadow-2xl">
          <img src="/static/img/honesty2.jpeg" alt="Honesty" class="w-full h-full object-cover select-none transition duration-200" />
        </div>
      </div>
    </div>

    <a href="/sign-in" class="block mt-12 w-1/5 mx-auto text-center bg-[#2E3A8A] text-white rounded-lg py-3 text-[1.05rem] font-semibold shadow-md hover:bg-[#006BB8] active:scale-95 active:bg-[#595B73] transition">
      Sign in
    </a>
  </div>

  <!-- Mobile -->
  <div class="block md:hidden animate-fadein flex flex-col items-center w-11/12 mx-auto rounded-2xl shadow-xl px-4 pt-12 pb-8 text-center bg-white">
    <h1 class="font-black text-3xl select-none cursor-pointer inline-block tracking-tight text-center" tabindex="0">
      <span class="text-neutral-900">Fix IT </span>
      <span class="text-neutral-900">D</span>
      <span class="text-[#2E3A8A]">U</span>
      <span class="text-neutral-900">T</span>
    </h1>
    <p class="font-semibold text-[#595B73] text-lg select-none mt-2 mb-6 max-w-md tracking-wide">
      Better Maintenance, Smoother Campus.
    </p>

    <div class="flex flex-wrap justify-between pt4 pb-2 gap-4 mt-8 mb-4 w-full max-w-sm">
      <div class="flex-1 max-w-32 aspect-square rounded-xl shadow-md overflow-hidden bg-white transition-transform duration-200 hover:scale-110 hover:-rotate-2 hover:shadow-2xl">
        <img src='/static/img/accountability2.jpeg' alt="Accountability" class="w-full h-full object-cover select-none transition duration-200" />
      </div>
      <div class="flex-1 max-w-32 aspect-square rounded-xl shadow-md overflow-hidden bg-white transition-transform duration-200 hover:scale-110 hover:-rotate-2 hover:shadow-2xl">
        <img src="/static/img/transparency2.jpeg" alt="Transparency" class="w-full h-full object-cover select-none transition duration-200" />
      </div>
      <div class="flex-1 max-w-32 aspect-square rounded-xl shadow-md overflow-hidden bg-white transition-transform duration-200 hover:scale-110 hover:-rotate-2 hover:shadow-2xl">
        <img src="/static/img/honesty2.jpeg" alt="Honesty" class="w-full h-full object-cover select-none transition duration-200" />
      </div>
    </div>

    <a href="sign-in" class="block mt-6 w-1/2 mx-auto text-center bg-[#2E3A8A] text-white rounded-lg py-2.5 text-[1.05rem] font-semibold shadow-md hover:bg-[#006BB8] active:scale-95 active:bg-[#595B73] transition">
      Sign in
    </a>
  </div>
</body>
{% endblock %}
