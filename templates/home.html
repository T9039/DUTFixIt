{% extends 'base.html' %} {% block head %}

<title>Fix IT DUT</title>

<script>
  tailwind.config = {
    theme: {
      extend: {
        keyframes: {
          fadein: {
            "0%": { opacity: "0", transform: "translateY(20px)" },
            "100%": { opacity: "1", transform: "translateY(0)" },
          },
        },
        animation: {
          fadein: "fadein 0.8s cubic-bezier(.36,.07,.19,.97) both",
        },
      },
    },
  };
</script>
