<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.tailwindcss.com"></script>

    {% block head %}{% endblock %}
  </head>

  <body
    class="bg-cover min-h-screen bg-center bg-no-repeat" style="background-image: url('/static/img/bg-img-bt-desktop.jpeg');"
  >
    <div
      class="fixed top-[-120px] left-[-120px] right-0 bottom-0 w-screen h-screen opacity-20 blur-[40px] pointer-events-none z-0 bg-[radial-gradient(circle_at_25%_25%,#6366f1_0%,transparent_70%),radial-gradient(circle_at_75%_75%,#818cf8_0%,transparent_70%)]"
    ></div>

    <header class="bg-indigo-500 flex items-center justify-between px-6 py-4">
      <div
        class="flex items-center gap-3 cursor-pointer transition-transform duration-200 ease-out focus:outline-none"
        tabindex="0"
      >
        <img src="static/img/dut.png" alt="DUT Logo" class="h-8 w-auto" />
        <span class="font-extrabold text-xl text-white tracking-tight">
          Fix IT <span class="text-[#154734]">D</span
          ><span class="text-[#8a2be2]">U</span
          ><span class="text-[#aad5d7]">T</span>
        </span>
      </div>
      <nav class="flex items-center gap-6 text-white text-lg">
        <a
          href="/dashboard"
          aria-label="Home"
          title="Home"
          class="icon-btn hover:text-indigo-200 transition"
        >
          <!-- icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M9.293 2.293a1 1 0 0 1 1.414 0l7 7A1 1 0 0 1 17 11h-1v6a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-6H3a1 1 0 0 1-.707-1.707l7-7Z"
              clip-rule="evenodd"
            />
          </svg>
        </a>
        <button
          aria-label="Notifications"
          title="Notifications"
          class="icon-btn hover:text-indigo-200 transition"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M10 2a6 6 0 0 0-6 6c0 1.887-.454 3.665-1.257 5.234a.75.75 0 0 0 .515 1.076 32.91 32.91 0 0 0 3.256.508 3.5 3.5 0 0 0 6.972 0 32.903 32.903 0 0 0 3.256-.508.75.75 0 0 0 .515-1.076A11.448 11.448 0 0 1 16 8a6 6 0 0 0-6-6ZM8.05 14.943a33.54 33.54 0 0 0 3.9 0 2 2 0 0 1-3.9 0Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
        <a
          href="profile"
          aria-label="Profile"
          title="Profile"
          class="icon-btn hover:text-indigo-200 transition"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-5.5-2.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0ZM10 12a5.99 5.99 0 0 0-4.793 2.39A6.483 6.483 0 0 0 10 16.5a6.483 6.483 0 0 0 4.793-2.11A5.99 5.99 0 0 0 10 12Z"
              clip-rule="evenodd"
            />
          </svg>
        </a>
        <button
          id="logoutBtn"
          aria-label="Logout"
          title="Logout"
          class="icon-btn hover:text-indigo-200 flex items-center gap-1 transition"
        >
          <span>Logout</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            stroke="currentColor"
            class="w-4 h-4"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 11-4 0v-1m0-8V7a2 2 0 114 0v1"
            />
          </svg>
        </button>
      </nav>
    </header>

    {% block body %}{% endblock %}
  </body>
</html>
