<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="min-h-screen bg-gradient-to-br from-sky-300 to-indigo-300 flex flex-col"
  >
    <!-- Header -->
    <header class="bg-indigo-500 flex items-center justify-between px-6 py-4">
      <div class="flex items-center gap-3">
        <img src="static/img/dut.png" alt="DUT Logo" class="h-8 w-auto" />
      </div>
      <nav class="flex items-center gap-6 text-white text-lg">
        <!-- Home -->
        <a
          href="dashboard.html"
          aria-label="Home"
          title="Home"
          class="hover:text-indigo-200"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M9.293 2.293a1 1 0 0 1 1.414 0l7 7A1 1 0 0 1 17 11h-1v6a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-6H3a1 1 0 0 1-.707-1.707l7-7Z"
              clip-rule="evenodd"
            />
          </svg>
        </a>
        <!-- Notifications -->
        <button
          aria-label="Notifications"
          title="Notifications"
          class="hover:text-indigo-200"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M10 2a6 6 0 0 0-6 6c0 1.887-.454 3.665-1.257 5.234a.75.75 0 0 0 .515 1.076 32.91 32.91 0 0 0 3.256.508 3.5 3.5 0 0 0 6.972 0 32.903 32.903 0 0 0 3.256-.508.75.75 0 0 0 .515-1.076A11.448 11.448 0 0 1 16 8a6 6 0 0 0-6-6ZM8.05 14.943a33.54 33.54 0 0 0 3.9 0 2 2 0 0 1-3.9 0Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
        <!-- Profile -->
        <a
          href="Profile(DESKTOP).html"
          aria-label="Profile"
          title="Profile"
          class="hover:text-indigo-200"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-5.5-2.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0ZM10 12a5.99 5.99 0 0 0-4.793 2.39A6.483 6.483 0 0 0 10 16.5a6.483 6.483 0 0 0 4.793-2.11A5.99 5.99 0 0 0 10 12Z"
              clip-rule="evenodd"
            />
          </svg>
        </a>
        <!-- Logout -->
        <button
          id="logoutBtn"
          aria-label="Logout"
          title="Logout"
          class="hover:text-indigo-200 flex items-center gap-1"
        >
          <span>Logout</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            stroke="currentColor"
            class="w-4 h-4"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 11-4 0v-1m0-8V7a2 2 0 114 0v1"
            />
          </svg>
        </button>
      </nav>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-10">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-2xl p-8">
        <!-- Profile and Edit Row -->
        <div class="flex justify-between items-center mb-6">
          <a
            href="Profile(DESKTOP).html"
            class="text-xl font-bold text-indigo-700 select-none"
            >Profile</a
          >
          <button
            id="editBtn"
            class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700 transition-all font-semibold"
          >
            Edit
          </button>
        </div>

        <!-- Profile Info -->
        <form id="profileForm" class="space-y-6">
          <!-- DUT ID (non-editable) -->
          <div>
            <label class="block text-gray-600 font-medium">DUT ID</label>
            <span
              id="dutIdDisplay"
              class="block text-lg font-semibold text-gray-900"
            ></span>
          </div>

          <!-- EMAIL (non-editable) -->
          <div>
            <label class="block text-gray-600 font-medium">Email</label>
            <span
              id="emailDisplay"
              class="block text-lg font-semibold text-gray-900"
            ></span>
          </div>

          <!-- FULL NAME -->
          <div>
            <label class="block text-gray-600 font-medium">Full Name</label>
            <span
              id="fullNameDisplay"
              class="block text-lg font-semibold text-gray-900"
            ></span>
            <input
              id="fullNameInput"
              name="fullName"
              type="text"
              class="hidden mt-2 w-full rounded border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <!-- SURNAME -->
          <div>
            <label class="block text-gray-600 font-medium">Surname</label>
            <span
              id="surnameDisplay"
              class="block text-lg font-semibold text-gray-900"
            ></span>
            <input
              id="surnameInput"
              name="surname"
              type="text"
              class="hidden mt-2 w-full rounded border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <!-- GENDER -->
          <div>
            <label class="block text-gray-600 font-medium">Gender</label>
            <span
              id="genderDisplay"
              class="block text-lg font-semibold text-gray-900"
            ></span>
            <select
              id="genderInput"
              name="gender"
              class="hidden mt-2 w-full rounded border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option value="">Select Gender</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
              <option value="preferNotToSay">Prefer not to say</option>
            </select>
          </div>

          <!-- ROLE (non-editable) -->
          <div>
            <label class="block text-gray-600 font-medium">Role</label>
            <span
              id="roleDisplay"
              class="block text-lg font-semibold text-gray-900"
            ></span>
          </div>

          <!-- PASSWORD -->
          <div>
            <label class="block text-gray-600 font-medium">Password</label>
            <span
              id="passwordDisplay"
              class="block text-lg font-semibold text-gray-900 select-none"
              >••••••••</span
            >
            <div class="relative hidden" id="passwordEditWrapper">
              <input
                id="passwordInput"
                name="password"
                type="password"
                class="mt-2 w-full rounded border border-gray-300 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 pr-10"
              />
              <button
                id="togglePassword"
                type="button"
                class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-500"
              >
                <!-- eye svg omitted for brevity -->
              </button>
            </div>
          </div>
        </form>
      </div>
    </main>

    <script src="static/js/profile.js"></script>
  </body>
</html>
