<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report Issue - DUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-gradient-to-br from-indigo-100 to-indigo-200 min-h-screen transition-colors duration-500 font-sans"
  >
    <!-- Background shape -->
    <div
      class="fixed inset-0 -top-32 -left-32 opacity-20 pointer-events-none blur-3xl w-screen h-screen bg-[radial-gradient(circle_at_25%_25%,#6366f1_0%,transparent_70%),radial-gradient(circle_at_75%_75%,#818cf8_0%,transparent_70%)]"
    ></div>

    <!-- Header -->
    <header
      class="bg-indigo-500 flex items-center justify-between px-6 py-4 relative z-10"
    >
      <div
        class="flex items-center gap-3 transition-transform duration-200 cursor-pointer hover:scale-105 hover:-rotate-2 hover:shadow-lg"
        tabindex="0"
      >
        <img src="static/img/dut.png" alt="DUT Logo" class="h-8 w-auto" />
        <span
          class="font-extrabold text-xl text-white tracking-tight select-none"
        >
          Fix IT <span class="text-[#154734]">D</span
          ><span class="text-[#8a2be2]">U</span
          ><span class="text-[#aad5d7]">T</span>
        </span>
      </div>
      <nav class="flex items-center gap-6 text-white text-lg">
        <a
          href="dashboard.html"
          aria-label="Home"
          title="Home"
          class="p-2 rounded-md transition-transform duration-200 hover:scale-110 hover:text-indigo-200"
        >
          <!-- Home icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M9.293 2.293a1 1 0 0 1 1.414 0l7 7A1 1 0 0 1 17 11h-1v6a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-6H3a1 1 0 0 1-.707-1.707l7-7Z"
              clip-rule="evenodd"
            />
          </svg>
        </a>
        <button
          aria-label="Notifications"
          title="Notifications"
          class="p-2 rounded-md transition-transform duration-200 hover:scale-110 hover:text-indigo-200"
        >
          <!-- Bell -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M10 2a6 6 0 0 0-6 6c0 1.887-.454 3.665-1.257 5.234a.75.75 0 0 0 .515 1.076 
                 32.91 32.91 0 0 0 3.256.508 3.5 3.5 0 0 0 6.972 0 
                 32.903 32.903 0 0 0 3.256-.508.75.75 0 0 0 
                 .515-1.076A11.448 11.448 0 0 1 16 8a6 6 0 0 0-6-6Z
                 M8.05 14.943a33.54 33.54 0 0 0 3.9 0 2 2 0 0 1-3.9 0Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
        <a
          href="Profile(DESKTOP).html"
          aria-label="Profile"
          title="Profile"
          class="p-2 rounded-md transition-transform duration-200 hover:scale-110 hover:text-indigo-200"
        >
          <!-- Profile -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-5.5-2.5a2.5 2.5 0 1 
                 1-5 0 2.5 2.5 0 0 1 5 0ZM10 12a5.99 5.99 0 0 0-4.793 
                 2.39A6.483 6.483 0 0 0 10 16.5a6.483 6.483 0 0 0 
                 4.793-2.11A5.99 5.99 0 0 0 10 12Z"
              clip-rule="evenodd"
            />
          </svg>
        </a>
        <button
          id="logoutBtn"
          aria-label="Logout"
          title="Logout"
          class="flex items-center gap-1 p-2 rounded-md transition-transform duration-200 hover:scale-110 hover:text-indigo-200"
        >
          <span>Logout</span>
          <!-- Logout icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            stroke="currentColor"
            class="w-4 h-4"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 11-4 
                 0v-1m0-8V7a2 2 0 114 0v1"
            />
          </svg>
        </button>
      </nav>
    </header>

    <!-- Main -->
    <main
      class="max-w-4xl mx-auto mt-10 p-6 bg-gray-200 rounded-lg animate-[fadeInUp_0.7s_cubic-bezier(.36,.07,.19,.97)]"
    >
      <h1 class="text-xl font-bold mb-6 select-none">Report an Issue</h1>
      <!-- form stays unchanged -->

      <form id="reportForm" class="space-y-6">
        <!-- (all the form fields exactly like before) -->
        <div class="flex gap-6">
          <div class="flex-1">
            <label for="categorySelect" class="block mb-1 font-medium"
              >Category</label
            >
            <select
              id="categorySelect"
              class="w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring-2 focus:ring-indigo-500"
              required
            >
              <option value="" disabled selected>Select a category</option>
              <option>Electrical</option>
              <option>Plumbing</option>
              <option>Infrastructure</option>
              <!-- <option>IT / Technology</option> -->
              <option>General / Other</option>
            </select>
          </div>
          <div class="flex-1">
            <label for="typeSelect" class="block mb-1 font-medium">Type</label>
            <select
              id="typeSelect"
              class="w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring-2 focus:ring-indigo-500"
              required
            >
              <option value="" disabled selected>Select a type</option>
              <optgroup label="Electrical">
                <option>Projector</option>
                <option>Light Bulb</option>
                <option>Switch</option>
                <option>Socket/Plug</option>
                <option>Extension Cord</option>
                <option>Wiring</option>
                <option>Other</option>
              </optgroup>
              <optgroup label="Plumbing">
                <option>Faucet</option>
                <option>Toilet</option>
                <option>Sink</option>
                <option>Pipe</option>
                <option>Drain</option>
                <option>Shower</option>
                <option>Other</option>
              </optgroup>
              <optgroup label="Infrastructure">
                <option>Chair</option>
                <option>Table</option>
                <option>Door</option>
                <option>Window</option>
                <option>Roof Leak</option>
                <option>Wall Crack</option>
                <option>Other</option>
              </optgroup>
              <!-- <optgroup label="IT / Technology"> -->
              <!--   <option>Computer</option><option>Printer</option><option>Network (WiFi)</option> -->
              <!--   <option>Lab Equipment</option><option>Software</option><option>Other</option> -->
              <!-- </optgroup> -->
              <optgroup label="General / Other">
                <option>Cleaning</option>
                <option>Furniture (other than above)</option>
                <option>Safety Hazard</option>
                <option>Other</option>
              </optgroup>
            </select>
            <input
              type="text"
              id="otherTypeInput"
              placeholder="If Other, describe here"
              class="mt-2 w-full rounded-md border border-gray-300 p-2 shadow-sm hidden"
            />
          </div>
        </div>
        <div class="flex gap-6 mt-4">
          <div class="flex-1">
            <label for="campusInput" class="block mb-1 font-medium"
              >Campus</label
            >
        <select
  id="campusSelect"
  class="w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring-2 focus:ring-indigo-500"
  required
>
  <option value="" disabled selected>Select a campus</option>
  <option value="Steve">Steve</option>
  <option value="Ritson">Ritson</option>
  <option value="ML Sultan">ML Sultan</option>
  <option value="City">City</option>
  <option value="Brickfield">Brickfield</option>
  <option value="Indumiso">Indumiso</option>
  <option value="Riverside">Riverside</option>
</select>
...
<select
  id="blockSelect"
  class="w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring-2 focus:ring-indigo-500"
  required
>
  <option value="" disabled selected>Select a block</option>
  <!-- Block options will be dynamically filled based on campus -->
</select>
          </div>
          <div class="flex-1">
            <label for="nearestClassInput" class="block mb-1 font-medium"
              >Nearest Class</label
            >
            <input
              type="text"
              id="nearestClassInput"
              class="w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring-2 focus:ring-indigo-500"
            />
          </div>
        </div>
        <div class="mt-4">
          <label for="descriptionInput" class="block mb-1 font-medium"
            >Issue Description</label
          >
          <textarea
            id="descriptionInput"
            rows="5"
            placeholder="Describe the issue in detail..."
            class="w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring-2 focus:ring-indigo-500 resize-none"
          ></textarea>
        </div>
        <button
          type="submit"
          class="mt-6 px-6 py-2 bg-indigo-700 text-white rounded-md hover:bg-indigo-800 transition-colors select-none card-animate"
        >
          Submit Report
        </button>
      </form>
    </main>

    <!-- External script -->
    <script src="static/js/report.js"></script>
  </body>
</html>
