<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report Issue - DUT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(120deg, #e0e7ff 0%, #c7d2fe 100%);
        min-height: 100vh;
        transition: background 0.5s;
      }
      .dashboard-shape {
        position: fixed;
        top: -120px;
        left: -120px;
        right: 0;
        bottom: 0;
        z-index: 0;
        pointer-events: none;
        opacity: 0.22;
        filter: blur(40px);
        width: 100vw;
        height: 100vh;
        background:
          radial-gradient(circle at 25% 25%, #6366f1 0%, transparent 70%),
          radial-gradient(circle at 75% 75%, #818cf8 0%, transparent 70%);
      }
      .logo-box {
        transition:
          transform 0.22s cubic-bezier(0.36, 0.07, 0.19, 0.97),
          box-shadow 0.22s cubic-bezier(0.36, 0.07, 0.19, 0.97);
        cursor: pointer;
      }
      .logo-box:hover,
      .logo-box:focus {
        transform: scale(1.08) rotate(-2deg);
        box-shadow: 0 4px 32px #6366f1bb;
      }
      .icon-btn {
        transition:
          transform 0.18s,
          box-shadow 0.18s,
          background 0.18s;
        outline: none;
        border-radius: 0.5rem;
        position: relative;
        overflow: hidden;
      }
      .icon-btn:hover,
      .icon-btn:focus {
        transform: scale(1.17);
        box-shadow: 0 2px 14px #6366f155;
        background: #e0e7ff44;
      }
      .icon-btn:active {
        transform: scale(0.93);
      }
      .ripple-effect {
        position: absolute;
        background: #a5b4fc44;
        border-radius: 50%;
        pointer-events: none;
        width: 36px;
        height: 36px;
        opacity: 0.7;
        z-index: 999;
        transform: scale(0);
        transition:
          transform 0.25s,
          opacity 0.45s;
      }
      .fade-in {
        animation: fadeInUp 0.7s cubic-bezier(0.36, 0.07, 0.19, 0.97);
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .card-animate {
        transition:
          box-shadow 0.18s,
          transform 0.18s,
          background 0.18s;
      }
      .card-animate:hover {
        box-shadow: 0 8px 24px #6366f122;
        transform: scale(1.03) rotate(-1deg);
        background: #e0e7ff;
      }
      .select-none {
        user-select: none;
      }
    </style>
  </head>
  <body class="bg-gray-100 font-sans">
    <div class="dashboard-shape"></div>
    <header class="bg-indigo-500 flex items-center justify-between px-6 py-4">
      <div class="flex items-center gap-3 logo-box" tabindex="0">
        <img
          src="dut.png"
          alt="DUT Logo"
          class="h-8 w-auto transition-all duration-200"
        />
        <span
          class="font-extrabold text-xl text-white tracking-tight select-none"
        >
          Fix IT <span style="color: #154734">D</span
          ><span style="color: #8a2be2">U</span
          ><span style="color: #aad5d7">T</span>
        </span>
      </div>
      <nav class="flex items-center gap-6 text-white text-lg">
        <a
          href="dashboard.html"
          aria-label="Home"
          title="Home"
          class="icon-btn hover:text-indigo-200 transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M9.293 2.293a1 1 0 0 1 1.414 0l7 7A1 1 0 0 1 17 11h-1v6a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1v-3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-6H3a1 1 0 0 1-.707-1.707l7-7Z"
              clip-rule="evenodd"
            />
          </svg>
        </a>
        <button
          aria-label="Notifications"
          title="Notifications"
          class="icon-btn hover:text-indigo-200 transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M10 2a6 6 0 0 0-6 6c0 1.887-.454 3.665-1.257 5.234a.75.75 0 0 0 .515 1.076 32.91 32.91 0 0 0 3.256.508 3.5 3.5 0 0 0 6.972 0 32.903 32.903 0 0 0 3.256-.508.75.75 0 0 0 .515-1.076A11.448 11.448 0 0 1 16 8a6 6 0 0 0-6-6ZM8.05 14.943a33.54 33.54 0 0 0 3.9 0 2 2 0 0 1-3.9 0Z"
              clip-rule="evenodd"
            />
          </svg>
        </button>
        <a
          href="Profile(DESKTOP).html"
          aria-label="Profile"
          title="Profile"
          class="icon-btn hover:text-indigo-200 transition-colors"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 20 20"
            fill="currentColor"
            class="w-5 h-5"
          >
            <path
              fill-rule="evenodd"
              d="M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Zm-5.5-2.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0ZM10 12a5.99 5.99 0 0 0-4.793 2.39A6.483 6.483 0 0 0 10 16.5a6.483 6.483 0 0 0 4.793-2.11A5.99 5.99 0 0 0 10 12Z"
              clip-rule="evenodd"
            />
          </svg>
        </a>
        <button
          id="logoutBtn"
          aria-label="Logout"
          title="Logout"
          class="icon-btn hover:text-indigo-200 flex items-center gap-1 transition-colors"
        >
          <span>Logout</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            stroke="currentColor"
            class="w-4 h-4"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a2 2 0 11-4 0v-1m0-8V7a2 2 0 114 0v1"
            />
          </svg>
        </button>
      </nav>
    </header>

    <main class="max-w-4xl mx-auto mt-10 p-6 bg-gray-200 rounded-lg fade-in">
      <h1 class="text-xl font-bold mb-6 select-none">Report an Issue</h1>

      <form id="reportForm" class="space-y-6">
        <div class="flex gap-6">
          <div class="flex-1">
            <label for="categorySelect" class="block mb-1 font-medium"
              >Category</label
            >
            <select
              id="categorySelect"
              class="w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring-2 focus:ring-indigo-500"
              required
            >
              <option value="" disabled selected>Select a category</option>
              <option>Electrical</option>
              <option>Plumbing</option>
              <option>Infrastructure</option>
              <!-- <option>IT / Technology</option> -->
              <option>General / Other</option>
            </select>
          </div>
          <div class="flex-1">
            <label for="typeSelect" class="block mb-1 font-medium">Type</label>
            <select
              id="typeSelect"
              class="w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring-2 focus:ring-indigo-500"
              required
            >
              <option value="" disabled selected>Select a type</option>
              <optgroup label="Electrical">
                <option>Projector</option>
                <option>Light Bulb</option>
                <option>Switch</option>
                <option>Socket/Plug</option>
                <option>Extension Cord</option>
                <option>Wiring</option>
                <option>Other</option>
              </optgroup>
              <optgroup label="Plumbing">
                <option>Faucet</option>
                <option>Toilet</option>
                <option>Sink</option>
                <option>Pipe</option>
                <option>Drain</option>
                <option>Shower</option>
                <option>Other</option>
              </optgroup>
              <optgroup label="Infrastructure">
                <option>Chair</option>
                <option>Table</option>
                <option>Door</option>
                <option>Window</option>
                <option>Roof Leak</option>
                <option>Wall Crack</option>
                <option>Other</option>
              </optgroup>
              <!-- <optgroup label="IT / Technology"> -->
              <!--   <option>Computer</option><option>Printer</option><option>Network (WiFi)</option> -->
              <!--   <option>Lab Equipment</option><option>Software</option><option>Other</option> -->
              <!-- </optgroup> -->
              <optgroup label="General / Other">
                <option>Cleaning</option>
                <option>Furniture (other than above)</option>
                <option>Safety Hazard</option>
                <option>Other</option>
              </optgroup>
            </select>
            <input
              type="text"
              id="otherTypeInput"
              placeholder="If Other, describe here"
              class="mt-2 w-full rounded-md border border-gray-300 p-2 shadow-sm hidden"
            />
          </div>
        </div>
        <div class="flex gap-6 mt-4">
          <div class="flex-1">
            <label for="campusInput" class="block mb-1 font-medium"
              >Campus</label
            >
            <input
              type="text"
              id="campusInput"
              class="w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <div class="flex-1">
            <label for="blockInput" class="block mb-1 font-medium">Block</label>
            <input
              type="text"
              id="blockInput"
              class="w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring-2 focus:ring-indigo-500"
            />
          </div>
          <div class="flex-1">
            <label for="nearestClassInput" class="block mb-1 font-medium"
              >Nearest Class</label
            >
            <input
              type="text"
              id="nearestClassInput"
              class="w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring-2 focus:ring-indigo-500"
            />
          </div>
        </div>
        <div class="mt-4">
          <label for="descriptionInput" class="block mb-1 font-medium"
            >Issue Description</label
          >
          <textarea
            id="descriptionInput"
            rows="5"
            placeholder="Describe the issue in detail..."
            class="w-full rounded-md border border-gray-300 p-2 shadow-sm focus:ring-2 focus:ring-indigo-500 resize-none"
          ></textarea>
        </div>
        <button
          type="submit"
          class="mt-6 px-6 py-2 bg-indigo-700 text-white rounded-md hover:bg-indigo-800 transition-colors select-none card-animate"
        >
          Submit Report
        </button>
      </form>
    </main>

    <script>
      const STORAGE_KEY = "dut_requests_v1";
      const logoutBtn = document.getElementById("logoutBtn");
      const $ = (id) => document.getElementById(id);
      function generateId() {
        let lastRef = parseInt(
          localStorage.getItem("dut_last_ref_no") || "0",
          10,
        );
        let nextRef = lastRef + 1;
        localStorage.setItem("dut_last_ref_no", nextRef);
        return "#" + nextRef.toString().padStart(4, "0");
      }
      function saveRequests(arr) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
      }
      function loadRequests() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch {
          return [];
        }
      }
      $("categorySelect").addEventListener("change", (e) => {
        const typeSel = $("typeSelect");
        const groups = typeSel.querySelectorAll("optgroup");
        groups.forEach((g) => (g.hidden = g.label !== e.target.value));
        typeSel.value = "";
        $("otherTypeInput").classList.add("hidden");
      });
      $("typeSelect").addEventListener("change", (e) => {
        if (e.target.value === "Other")
          $("otherTypeInput").classList.remove("hidden");
        else $("otherTypeInput").classList.add("hidden");
      });
      $("reportForm").addEventListener("submit", (e) => {
        e.preventDefault();
        let category = $("categorySelect").value;
        let type = $("typeSelect").value;
        if (type === "Other")
          type = $("otherTypeInput").value.trim() || "Other";
        const campus = $("campusInput").value.trim();
        const block = $("blockInput").value.trim();
        const nearestClass = $("nearestClassInput").value.trim();
        const description = $("descriptionInput").value.trim();
        if (!category || !type || !description) {
          alert("Please fill in required fields");
          return;
        }
        const now = new Date();
        const req = {
          id: generateId(),
          category,
          type,
          campus,
          block,
          nearestClass,
          notes: description,
          status: "pending",
          date: now.toLocaleDateString("en-GB"),
          time: now.toLocaleTimeString("en-GB", {
            hour: "2-digit",
            minute: "2-digit",
          }),
        };
        const arr = loadRequests();
        arr.unshift(req);
        saveRequests(arr);
        window.location.href = "dashboard.html";
      });

      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          localStorage.removeItem("signedInEmail");
          localStorage.removeItem("userProfile");
          window.location.href = "Sign in (DESKTOP).html";
        });
      }

      // Logo bounce effect (like sign-in page/dashboard)
      document.querySelectorAll(".logo-box").forEach((logo) => {
        logo.addEventListener(
          "mousedown",
          () => (logo.style.transform = "scale(0.96) rotate(-1deg)"),
        );
        logo.addEventListener("mouseup", () => (logo.style.transform = ""));
        logo.addEventListener("mouseleave", () => (logo.style.transform = ""));
        logo.addEventListener(
          "touchstart",
          () => (logo.style.transform = "scale(0.96) rotate(-1deg)"),
        );
        logo.addEventListener("touchend", () => (logo.style.transform = ""));
      });

      // Ripple effect for top right icon buttons
      document.querySelectorAll(".icon-btn").forEach((btn) => {
        btn.addEventListener("click", function (e) {
          const ripple = document.createElement("span");
          ripple.className = "ripple-effect";
          ripple.style.left = e.offsetX - 18 + "px";
          ripple.style.top = e.offsetY - 18 + "px";
          btn.appendChild(ripple);
          setTimeout(() => {
            ripple.style.transform = "scale(1.5)";
            ripple.style.opacity = "0";
          }, 10);
          setTimeout(() => {
            ripple.remove();
          }, 500);
        });
      });
    </script>
  </body>
</html>
