{% extends 'main-base.html' %}
{% block head %}
<title>Report Issue - DUT</title>
{% endblock %}

{% block body %}
<div
  class="min-h-screen flex items-center justify-center "
>
  <main
    class="max-w-4xl w-[90%] mx-auto my-10 p-8 bg-white rounded-2xl shadow-2xl animate-[fadeInUp_0.7s_cubic-bezier(.36,.07,.19,.97)]"
  >
    <h1 class="text-2xl font-bold mb-8 text-[#0A0C09] select-none">
      Report an Issue
    </h1>

    <form id="reportForm" class="space-y-8">
      <!-- Category + Type -->
      <div class="flex flex-col md:flex-row gap-6">
        <div class="flex-1">
          <label for="categorySelect" class="block mb-1 font-semibold text-gray-800"
            >Category</label
          >
          <select
            id="categorySelect"
            class="w-full rounded-md border border-gray-300 p-2.5 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
            required
          >
            <option value="" disabled selected>Select a category</option>
            <option>Electrical</option>
            <option>Plumbing</option>
            <option>Infrastructure</option>
            <option>General / Other</option>
          </select>
        </div>

        <div class="flex-1">
          <label for="typeSelect" class="block mb-1 font-semibold text-gray-800"
            >Type</label
          >
          <select
            id="typeSelect"
            class="w-full rounded-md border border-gray-300 p-2.5 shadow-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"
            required
          >
            <option value="" disabled selected>Select a type</option>
            <optgroup label="Electrical">
              <option>Projector</option>
              <option>Light Bulb</option>
              <option>Switch</option>
              <option>Socket/Plug</option>
              <option>Extension Cord</option>
              <option>Wiring</option>
              <option>Other</option>
            </optgroup>
            <optgroup label="Plumbing">
              <option>Faucet</option>
              <option>Toilet</option>
              <option>Sink</option>
              <option>Pipe</option>
              <option>Drain</option>
              <option>Shower</option>
              <option>Other</option>
            </optgroup>
            <optgroup label="Infrastructure">
              <option>Chair</option>
              <option>Table</option>
              <option>Door</option>
              <option>Window</option>
              <option>Roof Leak</option>
              <option>Wall Crack</option>
              <option>Other</option>
            </optgroup>
            <optgroup label="General / Other">
              <option>Cleaning</option>
              <option>Furniture (other than above)</option>
              <option>Safety Hazard</option>
              <option>Other</option>
            </optgroup>
          </select>

          <input
            type="text"
            id="otherTypeInput"
            placeholder="If Other, describe here"
            class="mt-2 w-full rounded-md border border-gray-300 p-2.5 shadow-sm hidden focus:ring-2 focus:ring-indigo-500"
          />
        </div>
      </div>

      <!-- Campus + Location -->
      <div class="flex flex-col md:flex-row gap-6">
        <div class="flex-1">
          <label for="campusSelect" class="block mb-1 font-semibold text-gray-800"
            >Campus</label
          >
          <select
            id="campusSelect"
            class="w-full rounded-md border border-gray-300 p-2.5 shadow-sm focus:ring-2 focus:ring-indigo-500"
            required
          >
            <option value="" disabled selected>Select a campus</option>
            <option value="Steve">Steve</option>
            <option value="Ritson">Ritson</option>
            <option value="ML Sultan">ML Sultan</option>
            <option value="City">City</option>
            <option value="Brickfield">Brickfield</option>
            <option value="Indumiso">Indumiso</option>
            <option value="Riverside">Riverside</option>
          </select>

          <select
            id="blockSelect"
            class="w-full rounded-md border border-gray-300 p-2.5 shadow-sm focus:ring-2 focus:ring-indigo-500 mt-3"
            required
          >
            <option value="" disabled selected>Select a block</option>
          </select>
        </div>

        <div class="flex-1">
          <label class="block mb-1 font-semibold text-gray-800"
            >Problem Location</label
          >
          <div class="flex gap-4 mb-2">
            <label class="inline-flex items-center cursor-pointer">
              <input
                type="radio"
                name="locationType"
                id="locationInside"
                value="inside"
                class="w-4 h-4 text-indigo-600 focus:ring-2 focus:ring-indigo-500"
              />
              <span class="ml-2 text-gray-700">Inside a class</span>
            </label>

            <label class="inline-flex items-center cursor-pointer">
              <input
                type="radio"
                name="locationType"
                id="locationOutside"
                value="outside"
                class="w-4 h-4 text-indigo-600 focus:ring-2 focus:ring-indigo-500"
              />
              <span class="ml-2 text-gray-700">Outside a class</span>
            </label>
          </div>

          <select
            id="classSelect"
            class="w-full rounded-md border border-gray-300 p-2.5 shadow-sm focus:ring-2 focus:ring-indigo-500 hidden"
          >
            <option value="" disabled selected>Select a class</option>
          </select>

          <input
            type="text"
            id="nearestClassInput"
            placeholder="Enter nearest class"
            class="w-full rounded-md border border-gray-300 p-2.5 shadow-sm focus:ring-2 focus:ring-indigo-500 hidden"
          />
        </div>
      </div>

      <!-- Description -->
      <div>
        <label
          for="descriptionInput"
          class="block mb-1 font-semibold text-gray-800"
          >Issue Description</label
        >
        <textarea
          id="descriptionInput"
          rows="5"
          placeholder="Describe the issue in detail..."
          class="w-full rounded-md border border-gray-300 p-2.5 shadow-sm focus:ring-2 focus:ring-indigo-500 resize-none"
        ></textarea>
      </div>

      <!-- Upload -->
      <div>
        <label
          for="issueImage"
          class="block mb-1 font-semibold text-gray-800"
          >Upload / Take a Picture</label
        >
        <input
          type="file"
          id="issueImage"
          name="issueImage"
          accept="image/*"
          capture="environment"
          class="w-full rounded-md border border-gray-300 p-2.5 shadow-sm focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <!-- Button -->
      <div class="flex justify-end">
        <button
          type="submit"
          class="px-6 py-2.5 bg-[#2E3A8A] text-white rounded-md hover:bg-indigo-800 transition-all font-semibold select-none card-animate shadow-md"
        >
          Submit Report
        </button>
      </div>
    </form>
  </main>
</div>

<script src="{{ url_for('static', filename='js/report.js') }}"></script>
{% endblock %}
