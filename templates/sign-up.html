{% extends 'base.html' %} {% block head %}

<title>Sign-up</title>
<style>
  @keyframes fadein {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  .animate-fadein {
    animation: fadein 0.8s ease-in-out;
  }
</style>

{% endblock %} {% block body %}

  <!--        style="background:radial-gradient(circle at 20% 30%,#818cf8 0%,transparent 70%),radial-gradient(circle at 80% 70%,#a5b4fc 0%,transparent 70%);"></div> -->
  <!-- </div> -->

  <!-- Logo and Tagline OUTSIDE the container, directly on top -->

  <!--     Better maintenance, Smoother Campus. -->

  <!-- Toast container for feedback -->
  <div
    id="toast-container"
    class="fixed top-6 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 items-center"
  ></div>

  <!-- Main Container -->
<div class="min-h-screen flex items-center justify-center">
  <div
    class="w-full max-w-md md:max-w-xl mx-auto flex flex-col items-center justify-center animate-fadein px-2"
  >
    <div
      class="bg-white/95 backdrop-blur-sm rounded-2xl shadow-2xl w-full px-4 py-6 md:px-10 md:py-12 flex flex-col items-center"
    >
      <!-- Sign-up Form (desktop & mobile unified, JS expects both IDs) -->
      <form
        id="desktopSignUpForm"
        class="w-full space-y-4"
        action="sign-in.html"
        method="get"
      >
        <h2
          class="text-xl md:text-2xl font-bold text-indigo-900 mb-1 text-center"
        >
          Sign Up
        </h2>
        <p
          class="text-indigo-500 mb-2 text-center font-medium text-sm md:text-base"
        >
          Create your account
        </p>
        <div>
          <label
            for="email"
            class="block text-sm font-semibold text-indigo-900 mb-1"
            >Email</label
          >
          <div class="relative">
            <span
              class="absolute left-3 top-1/2 -translate-y-1/2 text-indigo-500 opacity-70"
            >
              <svg
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M2 6V4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2" />
                <rect x="2" y="6" width="16" height="12" rx="2" />
                <path d="M2 6l8 6 8-6" />
              </svg>
            </span>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              required
              class="w-full pl-10 pr-3 py-2 rounded-lg bg-indigo-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300 text-base shadow"
            />
          </div>
        </div>
        <div>
          <label
            for="role"
            class="block text-sm font-semibold text-indigo-900 mb-1"
            >Role</label
          >
          <select
            id="role"
            name="role"
            required
            class="w-full py-2 px-3 rounded-lg border border-gray-300 focus:border-purple-600 outline-none cursor-pointer bg-indigo-50 focus:bg-white focus:ring-2 focus:ring-indigo-300 text-base shadow"
          >
            <option value="" disabled selected>Choose role...</option>
            <option>Student</option>
            <option>Staff</option>
          </select>
        </div>
        <div>
          <label
            for="desktopPassword"
            class="block text-sm font-semibold text-indigo-900 mb-1"
            >Password</label
          >
          <div class="relative">
            <span
              class="absolute left-3 top-1/2 -translate-y-1/2 text-indigo-500 opacity-70"
            >
              <svg
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="6" y="8" width="8" height="8" rx="4" />
                <path d="M12 12v2" />
                <circle cx="10" cy="10" r="4" />
              </svg>
            </span>
            <input
              id="desktopPassword"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              class="w-full pl-10 pr-3 py-2 rounded-lg bg-indigo-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300 text-base shadow"
            />
          </div>
        </div>
        <div>
          <label
            for="desktopConfirmPassword"
            class="block text-sm font-semibold text-indigo-900 mb-1"
            >Confirm Password</label
          >
          <div class="relative">
            <span
              class="absolute left-3 top-1/2 -translate-y-1/2 text-indigo-500 opacity-70"
            >
              <svg
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="6" y="8" width="8" height="8" rx="4" />
                <path d="M12 12v2" />
                <circle cx="10" cy="10" r="4" />
              </svg>
            </span>
            <input
              id="desktopConfirmPassword"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              required
              class="w-full pl-10 pr-3 py-2 rounded-lg bg-indigo-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-indigo-300 text-base shadow"
            />
          </div>
        </div>
        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg shadow transition text-base"
        >
          Create
        </button>
        <p
          class="register-link text-indigo-500 text-center mt-2 font-medium text-sm"
        >
          <a
            href="sign-in"
            aria-label="Go to sign in page"
            class="underline hover:text-indigo-700"
            >Already have an account?</a
          >
        </p>
      </form>

      <!-- Hidden Mobile Form for JS compatibility -->
      <form id="mobileSignUpForm" class="hidden">
        <input id="mobilePassword" type="password" />
        <input id="mobileConfirmPassword" type="password" />
      </form>
    </div>
  </div>
</div>

<script src="static/js/sign-up.js"></script>
{% endblock %}
