{% extends 'base.html' %} {% block head %}

<title>Sign-up</title>

{% endblock %} {% block body %}
<!-- Mobile / Tablet -->
<main class="flex flex-col items-center min-h-screen p-5 text-center md:hidden">
  <h1 class="font-extrabold text-2xl mb-2 select-none">
    <span class="text-black">Fix IT </span>
    <span class="text-[#076f21]">D</span>
    <span class="text-[#8b5eb5]">U</span>
    <span class="text-[#a5dadc]">T</span>
  </h1>
  <div class="font-semibold text-sm mb-8 select-none">
    Better maintenance, Smoother Campus.
  </div>

  <form
    id="mobileSignUpForm"
    action="Sign in (DESKTOP).html"
    method="get"
    class="bg-white rounded-xl p-6 w-full max-w-md shadow-md text-left mb-5"
  >
    <h2 class="font-bold text-lg mb-3 select-none">Sign Up</h2>
    <input
      type="email"
      placeholder="Email"
      required
      class="w-full h-10 rounded-md border border-gray-300 px-3 mb-4 focus:border-purple-600 outline-none"
    />
    <select
      required
      class="w-full h-10 rounded-md border border-gray-300 px-3 mb-4 focus:border-purple-600 outline-none cursor-pointer"
    >
      <option value="" disabled selected>choose role...</option>
      <option>Student</option>
      <option>Staff</option>
    </select>
    <input
      type="password"
      id="mobilePassword"
      placeholder="Password"
      required
      class="w-full h-10 rounded-md border border-gray-300 px-3 mb-4 focus:border-purple-600 outline-none"
    />
    <input
      type="password"
      id="mobileConfirmPassword"
      placeholder="Confirm Password"
      required
      class="w-full h-10 rounded-md border border-gray-300 px-3 mb-4 focus:border-purple-600 outline-none"
    />
    <button
      type="submit"
      class="w-full h-11 rounded-md bg-black text-white font-semibold text-lg lowercase hover:bg-gray-800"
    >
      create
    </button>
  </form>

  <!-- Mobile Value Cards -->
  <div class="flex flex-row gap-4 justify-center w-full max-w-md mb-3">
    <div
      class="bg-white rounded-lg w-28 h-32 flex flex-col items-center justify-end p-2 shadow text-sm font-semibold select-none"
    >
      <img
        src="static/img/accountability.png"
        alt="Accountability"
        class="w-14 h-14 object-contain mb-2 rounded-md border border-gray-200 bg-gray-100"
      />
      <span class="text-[#154734]">accountability.</span>
    </div>
    <div
      class="bg-white rounded-lg w-28 h-32 flex flex-col items-center justify-end p-2 shadow text-sm font-semibold select-none"
    >
      <img
        src="static/img/Transperancy.png"
        alt="Transparency"
        class="w-14 h-14 object-contain mb-2 rounded-md border border-gray-200 bg-gray-100"
      />
      <span class="text-[#8a2be2]">transparency.</span>
    </div>
    <div
      class="bg-white rounded-lg w-28 h-32 flex flex-col items-center justify-end p-2 shadow text-sm font-semibold select-none"
    >
      <img
        src="static/img/honesty.png"
        alt="Honesty"
        class="w-14 h-14 object-contain mb-2 rounded-md border border-gray-200 bg-gray-100"
      />
      <span class="text-[#aad5d7]">honesty.</span>
    </div>
  </div>
</main>

<!-- Desktop -->
<section
  class="hidden md:flex h-screen items-start justify-between p-10 gap-8 bg-[#dbe6f8]"
>
  <div class="flex-1 max-w-md select-none">
    <h1 class="font-extrabold text-4xl mb-2">
      Fix IT
      <span class="text-[#154734]">D</span>
      <span class="text-[#8a2be2]">U</span>
      <span class="text-[#aad5d7]">T</span>
    </h1>
    <div class="font-bold text-base mb-9 text-black">
      Better Maintenance, Smoother Campus.
    </div>
    <div class="flex gap-6">
      <div
        class="bg-white rounded-xl w-48 h-48 flex flex-col items-center justify-end p-3 shadow font-bold text-sm select-none"
      >
        <img
          src="static/img/accountability.png"
          alt="Accountability"
          class="w-28 h-28 object-contain mb-3 rounded-lg border border-gray-200 bg-gray-100"
        />
        <span class="text-[#154734]">accountability.</span>
      </div>
      <div
        class="bg-white rounded-xl w-48 h-48 flex flex-col items-center justify-end p-3 shadow font-bold text-sm select-none"
      >
        <img
          src="static/img/Transperancy.png"
          alt="Transparency"
          class="w-28 h-28 object-contain mb-3 rounded-lg border border-gray-200 bg-gray-100"
        />
        <span class="text-[#8a2be2]">transparency.</span>
      </div>
      <div
        class="bg-white rounded-xl w-48 h-48 flex flex-col items-center justify-end p-3 shadow font-bold text-sm select-none"
      >
        <img
          src="static/img/honesty.png"
          alt="Honesty"
          class="w-28 h-28 object-contain mb-3 rounded-lg border border-gray-200 bg-gray-100"
        />
        <span class="text-[#aad5d7]">honesty.</span>
      </div>
    </div>
  </div>

  <div class="flex-1 max-w-sm bg-white rounded-2xl p-8 shadow-lg">
    <h2 class="text-center font-bold text-2xl mb-5 select-none text-black">
      Sign Up
    </h2>
    <form
      id="desktopSignUpForm"
      action="Sign in (DESKTOP).html"
      method="get"
      class="flex flex-col gap-4"
    >
      <input
        type="email"
        placeholder="Email"
        required
        class="h-11 rounded-lg border border-gray-300 px-3 focus:border-purple-600 outline-none"
      />
      <select
        required
        class="h-11 rounded-lg border border-gray-300 px-3 focus:border-purple-600 outline-none cursor-pointer"
      >
        <option value="" disabled selected>choose role...</option>
        <option>Student</option>
        <option>Staff</option>
      </select>
      <input
        type="password"
        id="desktopPassword"
        placeholder="Password"
        required
        class="h-11 rounded-lg border border-gray-300 px-3 focus:border-purple-600 outline-none"
      />
      <input
        type="password"
        id="desktopConfirmPassword"
        placeholder="Confirm Password"
        required
        class="h-11 rounded-lg border border-gray-300 px-3 focus:border-purple-600 outline-none"
      />
      <button
        type="submit"
        class="mt-2 py-3 rounded-xl bg-black text-white font-bold text-lg lowercase hover:bg-gray-800"
      >
        create
      </button>
    </form>
  </div>
</section>

<div id="toast-container" class="fixed top-5 right-5 space-y-3 z-50"></div>
<script src="static/js/sign-up.js"></script>
{% endblock %}
