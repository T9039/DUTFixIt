{% extends 'base.html' %} {% block head %}
<title>Sign Up</title>
{% endblock %} {% block body %}

<div class="w-full max-w-md bg-gray-800 p-6 rounded-lg shadow-lg">
  <h1 class="text-2xl font-bold mb-6 text-center">Sign In</h1>

  <form id="signin-form" class="space-y-4" onsubmit="return false;">
    <div>
      <label class="block text-gray-300 mb-1">Email</label>
      <input
        type="email"
        name="email"
        id="email"
        placeholder="email@example.com"
        class="w-full p-2 rounded-md bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      />
    </div>

    <div>
      <label class="block text-gray-300 mb-1">Password</label>
      <input
        type="password"
        name="password"
        id="password"
        placeholder="********"
        class="w-full p-2 rounded-md bg-gray-700 border border-gray-600 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"
        required
      />
    </div>

    <button
      type="submit"
      class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded-md transition"
    >
      Sign In
    </button>
  </form>

  <p class="mt-4 text-sm text-gray-400 text-center">
    Don’t have an account?
    <a href="/signup" class="text-blue-400 hover:underline">Sign up</a>
  </p>

  <section
    id="result"
    class="mt-4 p-3 rounded-md bg-gray-700 border border-gray-600 hidden"
  >
    <h2 class="text-lg font-semibold mb-2">Server response</h2>
    <pre
      id="responseJson"
      class="whitespace-pre-wrap break-words text-blue-300"
    ></pre>
  </section>
</div>
<script src="signin.js"></script>
{%endblock %}
